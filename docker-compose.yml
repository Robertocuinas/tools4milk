services:
  db:
    image: postgres:15-alpine
    container_name: tfm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tools4milk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql solo se ejecuta la primera vez que se crea el volumen.
      # Para resetear: docker-compose down -v && docker-compose up -d db
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tools4milk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tfm-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tools4milk
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-tools4milk-dev-secret-change-me}
      INITIAL_DEMO_PASSWORD: ${INITIAL_DEMO_PASSWORD:-testpass123}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://127.0.0.1","http://localhost:3000","http://127.0.0.1:3000"]'
      PYTHONUNBUFFERED: 1
      # T7: por defecto, adjuntos en el volumen local de abajo (persiste
      # entre `docker compose up`, no entre un despliegue real en un PaaS
      # de filesystem efimero). En Azure, definir STORAGE_BACKEND=azure_blob
      # + AZURE_STORAGE_CONNECTION_STRING para que sobrevivan a redespliegues.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/media/adjuntos
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-adjuntos}
      # T14 (ampliado): dictado por voz. Se intenta primero con un modelo
      # Vosk local (gratis, sin red) si hay uno configurado para el idioma
      # pedido; si no hay modelo o falla, cae a la API de OpenAI Whisper.
      # Los modelos NO se incluyen en la imagen (~40-50 MB de binarios cada
      # uno) — descargarlos de https://alphacephei.com/vosk/models,
      # descomprimirlos en ./backend/vosk_models/<nombre> y mapear aqui su
      # ruta por idioma, p.ej.:
      #   VOSK_MODEL_PATHS: '{"es": "/app/vosk_models/vosk-model-small-es-0.42"}'
      VOSK_MODEL_PATHS: ${VOSK_MODEL_PATHS:-{}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
    ports:
      - "8000:8000"
    volumes:
      - adjuntos_data:/app/media/adjuntos
      - ./backend/vosk_models:/app/vosk_models:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python scripts/apply_migrations.py && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        # Mismo valor que ENVIRONMENT del backend: controla si el login
        # muestra el panel de credenciales demo (hallazgo 5.1 de la
        # auditoria post-implementacion). Debe fijarse a "production" en
        # cualquier despliegue real.
        NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
    container_name: tfm-frontend
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: tfm-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  adjuntos_data:
